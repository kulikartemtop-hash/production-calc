<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    <title>🏭 Калькулятор производства</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --primary: #2563eb;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #d1d5db;
            --input-bg: #fafafa;
            --success: #10b981;
            --shadow: rgba(0,0,0,0.08);
        }
        
        [data-theme="dark"] {
            --bg: #111827;
            --card: #1f2937;
            --primary: #3b82f6;
            --text: #f9fafb;
            --text-secondary: #9ca3af;
            --border: #4b5563;
            --input-bg: #374151;
            --success: #34d399;
            --shadow: rgba(0,0,0,0.3);
        }
        
        * { transition: background-color 0.3s, color 0.1s; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .container { 
            max-width: 480px; 
            margin: 0 auto; 
            background: var(--card); 
            padding: 20px;             border-radius: 16px; 
            box-shadow: 0 4px 12px var(--shadow); 
        }
        
        /* Header with theme toggle */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        h1 { 
            font-size: 1.5rem; 
            margin: 0; 
        }
        .theme-toggle {
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .theme-toggle:active { transform: scale(0.9); }
        
        /* Form elements */
        label { 
            display: block; 
            margin-top: 14px; 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: var(--text);
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text);
        }
        input:focus, select:focus {             outline: none; 
            border-color: var(--primary); 
        }
        .row { 
            display: flex; 
            gap: 10px; 
        }
        .row input { flex: 2; }
        .row select { flex: 1; }
        
        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 20px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            font-weight: 600; 
            cursor: pointer; 
        }
        button:active { transform: scale(0.98); }
        
        /* Results */
        .result { 
            margin-top: 20px; 
            padding: 16px; 
            background: var(--input-bg); 
            border-radius: 12px; 
            line-height: 1.6; 
            font-size: 0.95rem; 
            border-left: 4px solid var(--primary); 
        }
        .error { 
            background: #fef2f2; 
            border-left-color: #ef4444; 
            color: #b91c1c; 
        }
        [data-theme="dark"] .error {
            background: #450a0a;
            color: #fca5a5;
        }
        
        /* Graph */
        .graph-container {
            margin-top: 20px;
            padding: 16px;
            background: var(--input-bg);
            border-radius: 12px;            display: none;
        }
        .graph-container.show { display: block; }
        .graph-title {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .graph {
            display: flex;
            align-items: flex-end;
            height: 120px;
            gap: 4px;
            padding: 10px 0;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            position: relative;
            opacity: 0.8;
        }
        .bar:hover { opacity: 1; }
        .bar-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        
        /* History */
        .history-container {
            margin-top: 20px;
            padding: 16px;
            background: var(--input-bg);
            border-radius: 12px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .history-title {
            font-weight: 600;
            font-size: 1rem;        }
        .clear-history {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .history-item {
            padding: 12px;
            background: var(--card);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
            font-size: 0.9rem;
        }
        .history-time {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 6px;
        }
        .no-history {
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏭 Производство</h1>
            <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">🌙</button>
        </div>
        
        <label>⏱ Время цикла (секунд):</label>
        <input type="number" id="cycle" placeholder="30" step="1">

        <label>🔗 Деталей на литнике:</label>
        <input type="number" id="perShot" placeholder="4">

        <label>📦 Деталей в коробке:</label>
        <input type="number" id="perBox" placeholder="100">

        <label>⏲ Период работы:</label>
        <div class="row">            <input type="number" id="period" placeholder="Число">
            <select id="unit">
                <option value="min">минут</option>
                <option value="hour">часов</option>
            </select>
        </div>

        <button onclick="calculate()">🧮 Рассчитать</button>
        
        <div class="result" id="output">Введите данные и нажмите кнопку</div>
        
        <div class="graph-container" id="graphContainer">
            <div class="graph-title">📊 Производство по часам</div>
            <div class="graph" id="graph"></div>
        </div>
        
        <div class="history-container">
            <div class="history-header">
                <div class="history-title">📜 История расчётов</div>
                <button class="clear-history" onclick="clearHistory()">Очистить</button>
            </div>
            <div id="historyList">
                <div class="no-history">История пуста</div>
            </div>
        </div>
    </div>

    <script>
        // Theme management
        function initTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon(saved);
        }
        
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }
        
        function updateThemeIcon(theme) {
            const btn = document.querySelector('.theme-toggle');
            btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        
        // History management
        function loadHistory() {            return JSON.parse(localStorage.getItem('calcHistory') || '[]');
        }
        
        function saveHistory(data) {
            let history = loadHistory();
            history.unshift({
                ...data,
                timestamp: new Date().toISOString()
            });
            if (history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('calcHistory', JSON.stringify(history));
            renderHistory();
        }
        
        function clearHistory() {
            localStorage.removeItem('calcHistory');
            renderHistory();
        }
        
        function renderHistory() {
            const history = loadHistory();
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="no-history">История пуста</div>';
                return;
            }
            
            container.innerHTML = history.map(item => {
                const date = new Date(item.timestamp);
                const timeStr = date.toLocaleString('ru-RU', { 
                    day: '2-digit', 
                    month: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                
                return `
                    <div class="history-item">
                        <div class="history-time">🕐 ${timeStr}</div>
                        <div>⏱ ${item.cycle}с | 🔗 ${item.perShot} | 📦 ${item.perBox}</div>
                        <div>📊 ${item.totalParts} шт. (${item.fullBoxes} кор.)</div>
                    </div>
                `;
            }).join('');
        }
        
        // Graph
        function drawGraph(cycle, perShot, totalMinutes) {
            const container = document.getElementById('graphContainer');            const graph = document.getElementById('graph');
            container.classList.add('show');
            
            const hours = Math.ceil(totalMinutes / 60);
            const partsPerHour = (3600 / cycle) * perShot;
            
            let html = '';
            for (let i = 1; i <= hours; i++) {
                const hourParts = Math.round(partsPerHour * (i === hours ? (totalMinutes % 60) / 60 : 1));
                const maxBar = partsPerHour * hours;
                const height = Math.max(4, (hourParts / maxBar) * 100);
                
                html += `
                    <div class="bar" style="height: ${height}%" title="Час ${i}: ${hourParts} шт.">
                        <span class="bar-label">${i}ч</span>
                    </div>
                `;
            }
            
            graph.innerHTML = html;
        }
        
        // Calculate
        function calculate() {
            const cycle = parseFloat(document.getElementById('cycle').value);
            const perShot = parseInt(document.getElementById('perShot').value);
            const perBox = parseInt(document.getElementById('perBox').value);
            const period = parseFloat(document.getElementById('period').value);
            const unit = document.getElementById('unit').value;
            const out = document.getElementById('output');

            if (!cycle || !perShot || !perBox || !period || cycle <= 0 || perShot <= 0 || perBox <= 0 || period <= 0) {
                out.className = 'result error';
                out.innerHTML = '⚠️ Заполните все поля положительными числами!';
                document.getElementById('graphContainer').classList.remove('show');
                return;
            }

            const totalMinutes = unit === 'hour' ? period * 60 : period;
            const totalSeconds = totalMinutes * 60;
            const totalCycles = totalSeconds / cycle;
            const totalParts = totalCycles * perShot;
            const fullBoxes = Math.floor(totalParts / perBox);
            const remaining = Math.round(totalParts % perBox);

            out.className = 'result';
            out.innerHTML = `
                📊 <b>Результат за ${period} ${unit === 'hour' ? 'час(ов)' : 'минут'}:</b><br><br>
                🔹 Циклов: <b>${totalCycles.toFixed(0)}</b><br>
                🔹 Деталей: <b>${Math.round(totalParts)} шт.</b><br>                🔹 Полных коробок: <b>${fullBoxes} шт.</b><br>
                🔹 В последней: <b>${remaining} шт.</b>
            `;
            
            // Save to history
            saveHistory({
                cycle,
                perShot,
                perBox,
                period,
                unit,
                totalParts: Math.round(totalParts),
                fullBoxes
            });
            
            // Draw graph
            drawGraph(cycle, perShot, totalMinutes);
        }
        
        // Initialize
        initTheme();
        renderHistory();
    </script>
</body>
</html>
