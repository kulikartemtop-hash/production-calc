<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>🏭 Калькулятор производства</title>
    <style>
        :root {
            --bg: #f4f6f9; --card: #ffffff; --primary: #2563eb; 
            --text: #1f2937; --text-sec: #6b7280; --border: #d1d5db;
            --input-bg: #fafafa; --success: #10b981; --shadow: rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg: #111827; --card: #1f2937; --primary: #3b82f6;
            --text: #f9fafb; --text-sec: #9ca3af; --border: #4b5563;
            --input-bg: #374151; --success: #34d399; --shadow: rgba(0,0,0,0.3);
        }
        * { transition: background 0.3s, color 0.1s; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 12px var(--shadow); }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 1.4rem; margin: 0; }
        .theme-toggle { background: var(--input-bg); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }

        /* Mode Switcher */
        .mode-switch { display: flex; background: var(--input-bg); padding: 4px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
        .mode-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px; font-weight: 600; color: var(--text-sec); cursor: pointer; font-size: 0.9rem; }
        .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Form */
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.85rem; color: var(--text-sec); }
        input, select { width: 100%; padding: 12px; margin-top: 4px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; background: var(--input-bg); color: var(--text); }
        input:focus { border-color: var(--primary); outline: none; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 2; } .row select { flex: 1; }
        
        button.calc-btn { width: 100%; padding: 14px; margin-top: 20px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        
        /* Results */
        .result-box { margin-top: 20px; padding: 15px; background: var(--input-bg); border-radius: 12px; border-left: 4px solid var(--primary); display: none; }
        .result-box.show { display: block; }
        .result-title { font-weight: bold; margin-bottom: 8px; display: block; }

        /* Graph & History */
        .graph-container { margin-top: 20px; display: none; }
        .graph { display: flex; align-items: flex-end; height: 80px; gap: 3px; padding-top: 10px; border-bottom: 1px solid var(--border); }
        .bar { flex: 1; background: var(--primary); opacity: 0.7; border-radius: 3px 3px 0 0; }        .history-list { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        .hist-item { font-size: 0.85rem; padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--text-sec); }
        
        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏭 Калькулятор</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>

    <!-- Переключатель режимов -->
    <div class="mode-switch">
        <button class="mode-btn active" id="btn-rate" onclick="setMode('rate')">⏱ Сколько сделаем?</button>
        <button class="mode-btn" id="btn-order" onclick="setMode('order')">🎯 До конца заказа</button>
    </div>

    <!-- Общие настройки -->
    <label> Время цикла (секунд):</label>
    <input type="number" id="cycle" placeholder="30">

    <label>🔗 Деталей на литнике:</label>
    <input type="number" id="perShot" placeholder="4">

    <label>📦 Деталей в коробке:</label>
    <input type="number" id="perBox" placeholder="100">

    <!-- Режим 1: Сколько сделаем -->
    <div id="mode-rate-inputs">
        <label> Считаем за:</label>
        <div class="row">
            <input type="number" id="period" placeholder="Число">
            <select id="unit">
                <option value="hour">часов</option>
                <option value="shift">смен (8ч)</option>
            </select>
        </div>
    </div>

    <!-- Режим 2: До конца заказа -->
    <div id="mode-order-inputs" class="hidden">
        <label> Всего деталей в заказе:</label>
        <input type="number" id="orderTotal" placeholder="5000">
    </div>

    <button class="calc-btn" onclick="calculate()">🧮 Рассчитать</button>
    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <span class="result-title" id="resTitle"></span>
        <div id="resText"></div>
        <div id="graph" class="graph-container">
            <div class="graph" id="graphBars"></div>
        </div>
    </div>

    <!-- История -->
    <div class="history-list" id="historyList">
        <div style="text-align:center; color:var(--text-sec); font-size:0.8rem;">История пуста</div>
    </div>
</div>

<script>
    let mode = 'rate';

    function initTheme() {
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        document.querySelector('.theme-toggle').textContent = saved === 'dark' ? '☀️' : '🌙';
        renderHistory();
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    function setMode(newMode) {
        mode = newMode;
        document.getElementById('btn-rate').classList.toggle('active', mode === 'rate');
        document.getElementById('btn-order').classList.toggle('active', mode === 'order');
        document.getElementById('mode-rate-inputs').classList.toggle('hidden', mode !== 'rate');
        document.getElementById('mode-order-inputs').classList.toggle('hidden', mode !== 'order');
        document.getElementById('resultBox').classList.remove('show');
    }

    function calculate() {
        const cycle = parseFloat(document.getElementById('cycle').value);
        const perShot = parseInt(document.getElementById('perShot').value);
        const perBox = parseInt(document.getElementById('perBox').value);
        const box = document.getElementById('resultBox');
        const title = document.getElementById('resTitle');
        const text = document.getElementById('resText');
        const graph = document.getElementById('graph');
        if (!cycle || !perShot || !perBox) {
            text.innerHTML = "⚠️ Заполните общие параметры!";
            box.classList.add('show');
            return;
        }

        box.classList.add('show');
        graph.style.display = 'none';

        if (mode === 'rate') {
            // Режим: Сколько сделаем
            const val = parseFloat(document.getElementById('period').value);
            const unit = document.getElementById('unit').value;
            if (!val) { text.innerHTML = "Введите время!"; return; }

            const minutes = unit === 'shift' ? val * 8 * 60 : val * 60;
            const seconds = minutes * 60;
            const cycles = seconds / cycle;
            const totalParts = Math.floor(cycles * perShot);
            const boxes = Math.floor(totalParts / perBox);
            const remParts = totalParts % perBox;

            title.innerText = `📊 Результат за ${val} ${unit === 'shift' ? 'смен' : 'час(ов)'}:`;
            text.innerHTML = `🔹 Всего деталей: <b>${totalParts} шт.</b><br> Полных коробок: <b>${boxes}</b><br>🔹 Остаток: ${remParts} шт.`;
            
            // График
            graph.style.display = 'block';
            drawGraph(cycle, perShot, minutes);
            
            saveToHistory(`За ${val}${unit==='shift'?'см':'ч'}: ${totalParts} шт.`);

        } else {
            // Режим: До конца заказа
            const totalOrder = parseInt(document.getElementById('orderTotal').value);
            if (!totalOrder) { text.innerHTML = "Введите количество заказа!"; return; }

            // Расчет
            const partsPerCycle = perShot;
            const cyclesNeeded = totalOrder / partsPerCycle;
            const secondsNeeded = cyclesNeeded * cycle;
            
            // Перевод во время
            const hours = Math.floor(secondsNeeded / 3600);
            const minutes = Math.floor((secondsNeeded % 3600) / 60);
            const shifts = (hours / 8).toFixed(1);

            title.innerText = "⏳ До конца заказа:";
            text.innerHTML = `🔹 Всего деталей: <b>${totalOrder}</b><br>🔹 Нужно времени: <b>${hours} ч ${minutes} мин</b><br>🔹 Это примерно: <b>${shifts} смен</b>`;
                        saveToHistory(`Заказ ${totalOrder}: нужно ${hours}ч ${minutes}м`);
        }
    }

    function drawGraph(cycle, perShot, totalMinutes) {
        const bars = document.getElementById('graphBars');
        bars.innerHTML = '';
        const hours = Math.ceil(totalMinutes / 60);
        const maxParts = (3600 / cycle) * perShot; // Деталей в час

        for (let i = 0; i < Math.min(hours, 10); i++) { // Рисуем до 10 часов
            const h = Math.min(100, (maxParts / ((3600/cycle)*perShot * 1.2)) * 100); 
            // Упрощенная высота для визуализации
            const div = document.createElement('div');
            div.className = 'bar';
            div.style.height = '60%'; // Статичная для примера, можно усложнить
            bars.appendChild(div);
        }
    }

    function saveToHistory(msg) {
        let h = JSON.parse(localStorage.getItem('history') || '[]');
        const time = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        h.unshift({time, msg});
        if (h.length > 5) h.pop();
        localStorage.setItem('history', JSON.stringify(h));
        renderHistory();
    }

    function renderHistory() {
        const h = JSON.parse(localStorage.getItem('history') || '[]');
        const el = document.getElementById('historyList');
        if (h.length === 0) return;
        el.innerHTML = h.map(i => `<div class="hist-item"><b>${i.time}</b>: ${i.msg}</div>`).join('');
    }

    initTheme();
</script>
</body>
    </html>
